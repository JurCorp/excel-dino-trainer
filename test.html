<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Jurassic Excel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f0f0f0;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .ru-btn {
            background: #4CAF50;
            color: white;
        }
        .en-btn {
            background: #2196F3;
            color: white;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #e8f5e8;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🧪 Тест Jurassic Excel</h1>
    
    <div class="test-section">
        <h2>Тест 1: Проверка кнопок</h2>
        <button id="test-ru" class="ru-btn">🇷🇺 Русский</button>
        <button id="test-en" class="en-btn">🇺🇸 English</button>
        <div id="test-result" class="result">Нажми на кнопку...</div>
    </div>
    
    <div class="test-section">
        <h2>Тест 2: Проверка localStorage</h2>
        <button id="save-ru">Сохранить русский</button>
        <button id="save-en">Сохранить английский</button>
        <button id="load-lang">Загрузить язык</button>
        <div id="storage-result" class="result">Результат localStorage...</div>
    </div>
    
    <div class="test-section">
        <h2>Тест 3: Проверка элементов DOM</h2>
        <div id="dom-result" class="result">Проверяем элементы...</div>
    </div>

    <script>
        // Тест 1: Простые обработчики
        document.getElementById('test-ru').addEventListener('click', function() {
            document.getElementById('test-result').innerHTML = '✅ Русский выбран!';
            document.getElementById('test-result').style.background = '#e8f5e8';
        });
        
        document.getElementById('test-en').addEventListener('click', function() {
            document.getElementById('test-result').innerHTML = '✅ English selected!';
            document.getElementById('test-result').style.background = '#e8f5e8';
        });
        
        // Тест 2: localStorage
        document.getElementById('save-ru').addEventListener('click', function() {
            localStorage.setItem('selectedLanguage', 'ru');
            document.getElementById('storage-result').innerHTML = '✅ Сохранен русский язык';
        });
        
        document.getElementById('save-en').addEventListener('click', function() {
            localStorage.setItem('selectedLanguage', 'en');
            document.getElementById('storage-result').innerHTML = '✅ Сохранен английский язык';
        });
        
        document.getElementById('load-lang').addEventListener('click', function() {
            const lang = localStorage.getItem('selectedLanguage');
            document.getElementById('storage-result').innerHTML = `📖 Загружен язык: ${lang || 'не выбран'}`;
        });
        
        // Тест 3: Проверка DOM
        window.addEventListener('DOMContentLoaded', function() {
            const ruBtn = document.getElementById('test-ru');
            const enBtn = document.getElementById('test-en');
            
            let domResult = '🔍 Проверка элементов:<br>';
            domResult += `Кнопка русский: ${ruBtn ? '✅ найдена' : '❌ не найдена'}<br>`;
            domResult += `Кнопка английский: ${enBtn ? '✅ найдена' : '❌ не найдена'}<br>`;
            
            domResult += '<br>🎯 Если все элементы найдены, значит проблема в основном коде!';
            
            document.getElementById('dom-result').innerHTML = domResult;
        });
        
        console.log('Тестовый файл загружен');
    </script>
</body>
</html>
